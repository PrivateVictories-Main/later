name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Test Core
        run: dotnet test windows/Later.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory "$RUNNER_TEMP/results"
      - name: Prove the network ban
        run: scripts/check-banned-api.sh

  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, arch: x64 }
          - { os: windows-11-arm, rid: win-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Show resolved packages
        shell: pwsh
        run: dotnet list windows/Later.App/Later.App.csproj package --include-transitive
      - name: Core tests on Windows
        run: dotnet test windows/Later.Core.Tests -c Release --logger "console;verbosity=detailed"
      - name: Windows unit tests
        run: dotnet test windows/Later.Windows.Tests -c Release --filter "Category!=Integration&Category!=Probe&Category!=Ui" --logger "console;verbosity=detailed"
      - name: Build the scanner
        run: dotnet build windows/tools/ImportScan -c Release
      - name: The scanner rejects every network channel (self-test)
        shell: pwsh
        run: scripts/scan-selftest.ps1
      - name: Publish the app
        run: dotnet publish windows/Later.App/Later.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -o windows/out/${{ matrix.rid }}
      - name: Scan the published output for network code
        run: dotnet run --project windows/tools/ImportScan -c Release -- windows/out/${{ matrix.rid }} --expected windows/runtime-imports.expected.${{ matrix.arch }}.txt
      - name: Publish folder summary
        shell: pwsh
        run: |
          $dir = 'windows/out/${{ matrix.rid }}'
          $files = Get-ChildItem $dir -Recurse -File
          $net = @($files | Where-Object { $_.Name -match '^System\.Net\.|^msquic\.dll$|^createdump\.exe$' })
          $deps = @(Select-String -Path "$dir/Later.deps.json" -Pattern 'msquic|createdump|System\.Net\.')
          Write-Host "publish folder: $($files.Count) files, $($net.Count) System.Net/msquic/createdump files, $($deps.Count) such lines in Later.deps.json"
          if ($net.Count -gt 0 -or $deps.Count -gt 0) { throw 'network-capable runtime files are still published' }
      - name: Self-test the published app
        shell: pwsh
        run: |
          $exe = 'windows/out/${{ matrix.rid }}/Later.exe'
          $out = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $p = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput $out
          $text = (Get-Content $out -Raw).Trim()
          Remove-Item $out -Force
          Write-Host "SELF-TEST exit=$($p.ExitCode) output='$text'"
          if ($p.ExitCode -ne 0 -or $text -ne 'self-test ok') { throw 'the self-test failed in the published folder' }
      - name: Smoke test the published app
        shell: pwsh
        run: |
          $exe = "windows/out/${{ matrix.rid }}/Later.exe"
          $agent = Start-Process $exe -ArgumentList '--agent' -PassThru -Wait
          if ($agent.ExitCode -ne 0) { throw "agent entry point exited $($agent.ExitCode)" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Later.exe exited early with $($p.ExitCode)" }
          $p | Stop-Process -Force
          Write-Host 'app started and stayed up for 6 s'

  # Decides whether this push asks for the diagnostic probe or for screenshots (a commit message containing [probe] or [shots], or a manual run).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      probe: ${{ steps.m.outputs.probe }}
      shots: ${{ steps.m.outputs.shots }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          msg=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.message)
          case "$msg" in *'[probe]'*) echo probe=true >> "$GITHUB_OUTPUT" ;; *) echo probe=$MANUAL >> "$GITHUB_OUTPUT" ;; esac
          case "$msg" in *'[shots]'*) echo shots=true >> "$GITHUB_OUTPUT" ;; *) echo shots=$MANUAL >> "$GITHUB_OUTPUT" ;; esac

  probe:
    name: probe (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.probe == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Find browsers
        shell: pwsh
        run: ./windows/scripts/find-browsers.ps1
      - name: Probe
        run: dotnet test windows/Later.Windows.Tests -c Release --filter "Category=Probe" --logger "console;verbosity=detailed"
        env:
          LATER_REQUIRE_BROWSERS: '1'

  integration:
    name: integration (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.probe != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      LATER_REQUIRE_BROWSERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Find browsers
        shell: pwsh
        run: ./windows/scripts/find-browsers.ps1
      - name: Reader integration tests
        run: dotnet test windows/Later.Windows.Tests -c Release --filter "Category=Integration&FullyQualifiedName!~AgentIntegration" --logger "console;verbosity=detailed"
      - name: Nothing left behind
        if: always()
        shell: pwsh
        run: |
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'helium') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'helium-dl') -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Filter 'LaterIT-*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

  # The background agent as a real process beside real browsers: saves, the lock handoff, a crash, and the cold cost (gate G2).
  agent:
    name: agent (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.probe != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, arch: x64 }
          - { os: windows-11-arm, rid: win-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LATER_REQUIRE_BROWSERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Find browsers
        shell: pwsh
        run: ./windows/scripts/find-browsers.ps1
      - name: Publish a Debug app (test hooks) and a Release app (measurement)
        run: |
          dotnet publish windows/Later.App/Later.App.csproj -c Debug -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -o windows/out-debug/${{ matrix.rid }}
          dotnet publish windows/Later.App/Later.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -o windows/out/${{ matrix.rid }}
      - name: Agent integration tests
        env:
          LATER_EXE: '${{ github.workspace }}/windows/out-debug/${{ matrix.rid }}/Later.exe'
        run: dotnet test windows/Later.Windows.Tests -c Release --filter "Category=Integration&FullyQualifiedName~AgentIntegration" --logger "console;verbosity=detailed"
      - name: Experiment build with ReadyToRun (not shipped)
        continue-on-error: true
        run: dotnet publish windows/Later.App/Later.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -p:PublishReadyToRun=true -o windows/out-r2r/${{ matrix.rid }}
      - name: Agent memory and CPU, cold and warm (Release)
        shell: pwsh
        run: |
          $r2r = 'windows/out-r2r/${{ matrix.rid }}/Later.exe'
          $extra = if (Test-Path $r2r) { @{ ReadyToRunExe = $r2r } } else { @{} }
          ./windows/scripts/measure-agent.ps1 -Exe "windows/out/${{ matrix.rid }}/Later.exe" -Seconds 30 -Experiment @extra
      - name: Nothing left behind
        if: always()
        shell: pwsh
        run: |
          Get-Process Later,chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'helium'), (Join-Path $env:RUNNER_TEMP 'helium-dl'), (Join-Path $env:LOCALAPPDATA 'Later') -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Filter 'LaterIT-*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

  # The sample window rendered in each scene, for looking at (Debug build: sample mode is not in Release). Only on a [shots] commit or a
  # manual run. The x64 leg also takes a plain screen copy, which shows the Mica backdrop; PrintWindow does not.
  screenshots:
    name: screenshots (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.shots == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, arch: x64 }
          - { os: windows-11-arm, rid: win-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Publish a Debug app
        run: dotnet publish windows/Later.App/Later.App.csproj -c Debug -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -o windows/out-debug/${{ matrix.rid }}
      - name: Render the sample window
        shell: pwsh
        run: ./windows/scripts/shots.ps1 -Exe "windows/out-debug/${{ matrix.rid }}/Later.exe" -Out "$env:RUNNER_TEMP/shots" -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 1
          if-no-files-found: error
      - name: Nothing left behind
        if: always()
        shell: pwsh
        run: |
          Get-Process Later -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'shots'), (Join-Path $env:RUNNER_TEMP 'later-shots-data') -ErrorAction SilentlyContinue

  # The app window driven through UI Automation, as assistive technology sees it: sample mode, names, counts, the status line.
  ui:
    name: ui (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, arch: x64 }
          - { os: windows-11-arm, rid: win-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Publish a Debug app
        run: dotnet publish windows/Later.App/Later.App.csproj -c Debug -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true -o windows/out-debug/${{ matrix.rid }}
      - name: UI tests
        env:
          LATER_EXE: '${{ github.workspace }}/windows/out-debug/${{ matrix.rid }}/Later.exe'
        run: dotnet test windows/Later.Windows.Tests -c Release --filter "Category=Ui" --logger "console;verbosity=detailed"
      - name: Nothing left behind
        if: always()
        shell: pwsh
        run: Get-Process Later -ErrorAction SilentlyContinue | Stop-Process -Force
